schema_version: 1

context:
  version: 1.6.0

package:
  name: harlequin-postgres
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/harlequin-postgres/harlequin_postgres-${{ version }}.tar.gz
  sha256: 48608904f81622493ff24f705b945ee4ff95c7b315d5c9fc81d9058204bc2104

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - psycopg >=3.2,<4
    - harlequin >=2.11,<3
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - harlequin_postgres

about:
  summary: A Harlequin adapter for Postgres.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tconbeer/harlequin-postgres

extra:
  recipe-maintainers:
    - conda-forge/harlequin
